.build_amd64: &build_amd64
  runner:
    tags: cnb:arch:amd64
    cpus: 64
  docker:
    image: quay.tencentcloudcr.com/skopeo/stable:latest
  services:
    - docker
  imports:
    - https://cnb.cool/myqm/key/-/blob/main/docker_images_key.yaml
  stages:
    - name: 记录构建开始时间
      script: date +%s
      exports:
        info: BUILD_START_TIMESTAMP
    - name: 打印环境变量
      script: env
    - name: 登录CNB镜像仓库
      script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
    - name: 登录腾讯云TCR镜像仓库
      script: docker login -u ${TencentCloud_TCR_UN} -p "${TencentCloud_TCR_PW}" ${TencentCloud_REGISTRY}
    - name: 打印即将要构建的应用
      script: echo "即将要构建的应用:$build_application_name 版本:$build_version"
    - name: 构建指定镜像
      timeout: 30m
      script: |
        unset REGISTRY_AUTH_FILE
        if [ -z "$build_version" ]; then
          cd Middleware/$build_application_name && bash build.sh
        else
          cd Middleware/$build_application_name/$build_version && bash build.sh
        fi
    - name: 查看指定镜像构建结果
      script: cat /tmp/CUSTOM_ENV_RESULT_INFO
      exports:
        code: CUSTOM_ENV_RESULT_CODE
        info: CUSTOM_ENV_RESULT_INFO
    - name: 打印指定镜像构建结果
      script:
        - cat /tmp/CUSTOM_ENV_RESULT_INFO
        - echo $CUSTOM_ENV_RESULT_CODE
        - echo -e "镜像地址版本:\n$CUSTOM_ENV_RESULT_INFO"
    - name: 计算构建耗时
      script: |
        start=${BUILD_START_TIMESTAMP}
        now=$(date +%s)
        elapsed=$((now - start))
        if [ $elapsed -lt 60 ]; then
          echo "${elapsed}s"
        else
          echo "$((elapsed / 60))m$((elapsed % 60))s"
        fi
      exports:
        info: CNB_BUILD_DURATION
    - name: 导出 AMD64 清单源镜像
      script: |
        set -euo pipefail
        unset REGISTRY_AUTH_FILE
        while IFS= read -r tcr_ref; do
          [ -z "$tcr_ref" ] && continue
          key="${tcr_ref##*/}"
          cnb_ref="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}/${key}"
          if [[ "$key" != *-amd64 ]]; then
            skopeo copy --insecure-policy "docker://${tcr_ref}" "docker://${tcr_ref}-amd64" >/dev/null
            skopeo copy --insecure-policy "docker://${cnb_ref}" "docker://${cnb_ref}-amd64" >/dev/null
            tcr_ref="${tcr_ref}-amd64"
            cnb_ref="${cnb_ref}-amd64"
          fi
          echo "tcr|${tcr_ref},cnb|${cnb_ref}"
        done < /tmp/CUSTOM_ENV_RESULT_INFO
      exports:
        info: ARCH_IMAGES

