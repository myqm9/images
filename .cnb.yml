main:
# 匹配所有分支名
"**":
  web_trigger_amd_three: ##构建中间件单个镜像-amd64
    - runner:
        tags: cnb:arch:amd64
        cpus: 64
      docker:
        image: docker.cnb.cool/tsingyun/devops/tsingyun-images/skopeo:latest
      services:
        - docker
      imports: 
        - https://cnb.cool/tsingyun/devops/credentials/-/blob/main/qingcloud-dockerhub.yaml
        - https://cnb.cool/tsingyun/devops/credentials/-/blob/main/wecom-message.yaml
        - https://cnb.cool/tsingyun/devops/credentials/-/blob/main/tsingyun-harbor.yaml
      stages:
        - name: 记录构建开始时间
          script: date +%s
          exports:
            info: BUILD_START_TIMESTAMP
        - name: 打印环境变量
          script: env
        - name: 登录CNB镜像仓库
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: 登录qingcloud镜像仓库
          script: docker login -u ${Qingcloud_Dockerhub_USER_NAME} -p "${Qingcloud_Dockerhub_PASSWORD}" ${Qingcloud_Dockerhub_REGISTRY}
        - name: 登录tsingyun-harbor镜像仓库
          script: docker login -u ${Tsingyun_Harbor_USER_NAME} -p "${Tsingyun_Harbor_PASSWORD}" ${Tsingyun_Harbor_REGISTRY}
        - name: 打印即将要构建的应用
          script: echo "即将要构建的应用:$build_application_name 版本:$build_version"
        - name: 构建指定镜像
          timeout: 30m
          script: |
            if [ -z "$build_version" ]; then
              cd Middleware/$build_application_name && bash build.sh
            else
              cd Middleware/$build_application_name/$build_version && bash build.sh
            fi
        - name: 查看指定镜像构建结果   
          script: cat /tmp/CUSTOM_ENV_RESULT_INFO
          exports:
            code: CUSTOM_ENV_RESULT_CODE
            info: CUSTOM_ENV_RESULT_INFO

        - name: 打印指定镜像构建结果   
          script:
            - cat /tmp/CUSTOM_ENV_RESULT_INFO
            - echo $CUSTOM_ENV_RESULT_CODE
            - echo -e "镜像地址版本:\n$CUSTOM_ENV_RESULT_INFO"

        - name: 计算构建耗时
          script: |
            start=${BUILD_START_TIMESTAMP}
            now=$(date +%s)
            elapsed=$((now - start))
            if [ $elapsed -lt 60 ]; then
              echo "${elapsed}s"
            else
              echo "$((elapsed / 60))m$((elapsed % 60))s"
            fi
          exports:
            info: CNB_BUILD_DURATION

        - name: 企微通知
          image: tencentcom/wecom-message
          settings:
            robot: ${qw_webhook_token}
            msgType: markdown_v2
            content: |
              🎉 AMD64镜像，构建成功
              | 项目构建地址 | 镜像地址 | 构建耗时 |
              | ------------ | -------- | -------- |
              | [${CNB_BUILD_WEB_URL}](${CNB_BUILD_WEB_URL}) | ${CUSTOM_ENV_RESULT_INFO} | ${CNB_BUILD_DURATION} |


      failStages:
        - name: 企微通知
          image: tencentcom/wecom-message
          settings:
            robot: ${qw_webhook_token}
            msgType: markdown_v2
            content: |
              # ❌ AMD64镜像，构建失败，请相关同事注意
              | 项目构建地址 | 构建耗时 |
              | ------------ | -------- |
              | [${CNB_BUILD_WEB_URL}](${CNB_BUILD_WEB_URL}) | ${CNB_BUILD_DURATION} |

