main:
# 匹配所有分支名
"**":
  web_trigger_amd_three: ##构建中间件单个镜像-amd64
    - runner:
        tags: cnb:arch:amd64
        cpus: 64
      docker:
        image: docker.cnb.cool/tsingyun/devops/tsingyun-images/skopeo:latest
      services:
        - docker
      imports:
        - https://cnb.cool/myqm/key/-/blob/main/docker_images_key.yaml
      stages:
        - name: 记录构建开始时间
          script: date +%s
          exports:
            info: BUILD_START_TIMESTAMP
        - name: 打印环境变量
          script: env
        - name: 登录CNB镜像仓库
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: 登录腾讯云TCR镜像仓库
          script: docker login -u ${TencentCloud_TCR_AK} -p "${TencentCloud_TCR_SK}" ${TencentCloud_REGISTRY}
        - name: 打印即将要构建的应用
          script: echo "即将要构建的应用:$build_application_name 版本:$build_version"
        - name: 构建指定镜像
          timeout: 30m
          script: |
            if [ -z "$build_version" ]; then
              cd Middleware/$build_application_name && bash build.sh
            else
              cd Middleware/$build_application_name/$build_version && bash build.sh
            fi
        - name: 查看指定镜像构建结果   
          script: cat /tmp/CUSTOM_ENV_RESULT_INFO
          exports:
            code: CUSTOM_ENV_RESULT_CODE
            info: CUSTOM_ENV_RESULT_INFO

        - name: 打印指定镜像构建结果   
          script:
            - cat /tmp/CUSTOM_ENV_RESULT_INFO
            - echo $CUSTOM_ENV_RESULT_CODE
            - echo -e "镜像地址版本:\n$CUSTOM_ENV_RESULT_INFO"

        - name: 计算构建耗时
          script: |
            start=${BUILD_START_TIMESTAMP}
            now=$(date +%s)
            elapsed=$((now - start))
            if [ $elapsed -lt 60 ]; then
              echo "${elapsed}s"
            else
              echo "$((elapsed / 60))m$((elapsed % 60))s"
            fi
          exports:
            info: CNB_BUILD_DURATION

  web_trigger_arm_three: ##构建中间件单个镜像-arm64
    - runner:
        tags: cnb:arch:arm64:v8
        cpus: 16
      docker:
        image: docker.cnb.cool/tsingyun/devops/tsingyun-images/skopeo:latest-arm64
      services:
        - docker
      imports:
        - https://cnb.cool/myqm/key/-/blob/main/docker_images_key.yaml
      stages:
        - name: 记录构建开始时间
          script: date +%s
          exports:
            info: BUILD_START_TIMESTAMP
        - name: 打印环境变量
          script: env
        - name: 登录CNB镜像仓库
          script: docker login -u ${CNB_TOKEN_USER_NAME} -p "${CNB_TOKEN}" ${CNB_DOCKER_REGISTRY}
        - name: 登录腾讯云TCR镜像仓库
          script: docker login -u ${TencentCloud_TCR_AK} -p "${TencentCloud_TCR_SK}" ${TencentCloud_REGISTRY}
        - name: 打印即将要构建的应用
          script: echo "即将要构建的应用:$build_application_name 版本:$build_version"
        - name: 构建指定镜像
          timeout: 30m
          script: |
            if [ -z "$build_version" ]; then
              cd Middleware/$build_application_name && bash build-arm64.sh
            else
              cd Middleware/$build_application_name/$build_version && bash build-arm64.sh
            fi
        - name: 查看指定镜像构建结果   
          script: cat /tmp/CUSTOM_ENV_RESULT_INFO
          exports:
            code: CUSTOM_ENV_RESULT_CODE
            info: CUSTOM_ENV_RESULT_INFO

        - name: 打印指定镜像构建结果   
          script:
            - cat /tmp/CUSTOM_ENV_RESULT_INFO
            - echo $CUSTOM_ENV_RESULT_CODE
            - echo -e "镜像地址版本:\n$CUSTOM_ENV_RESULT_INFO"

        - name: 计算构建耗时
          script: |
            start=${BUILD_START_TIMESTAMP}
            now=$(date +%s)
            elapsed=$((now - start))
            if [ $elapsed -lt 60 ]; then
              echo "${elapsed}s"
            else
              echo "$((elapsed / 60))m$((elapsed % 60))s"
            fi
          exports:
            info: CNB_BUILD_DURATION

