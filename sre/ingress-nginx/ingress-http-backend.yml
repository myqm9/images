kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: ingress-http-backend
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 200M # 允许请求体最大 200MB（用于大文件上传）
    nginx.ingress.kubernetes.io/proxy-connect-timeout: '3600' # 与后端建立连接超时时间（秒）
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600' # 从后端读取响应超时时间（秒）
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600' # 向后端发送请求超时时间（秒）
    nginx.ingress.kubernetes.io/rewrite-target: /$2 # 重写路径，保留第二个捕获组作为转发路径
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - k8s.srebro.cn
      secretName: srebro.cn-tls
  rules:
    - host: k8s.srebro.cn
      http:
        paths:
          - path: /back(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: tsingyun-gateway-svc
                port:
                  number: 8080
