version: "3"
services:
  postgres:
    image: postgres:15.7-alpine
    container_name: zabbix-postgres
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_pass
    command: -c max_connections=2000
    restart: always
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    network_mode: host

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.0-alpine-latest
    container_name: zabbix-server
    environment:
      DB_SERVER_HOST: 127.0.0.1
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_pass
      POSTGRES_DB: zabbix
      TZ: Asia/Shanghai
    volumes:
      - ./zabbix_alertscripts:/usr/lib/zabbix/alertscripts
    network_mode: host
    restart: always
    depends_on:
      - postgres

  zabbix-web-nginx:
    image: zabbix/zabbix-web-nginx-pgsql:7.0-alpine-latest
    container_name: zabbix-web-nginx
    environment:
      DB_SERVER_HOST: 127.0.0.1
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_pass
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: 127.0.0.1
      PHP_TZ: Asia/Shanghai
    network_mode: host
    restart: always
    depends_on:
      - zabbix-server
