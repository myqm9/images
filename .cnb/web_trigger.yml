# .cnb/web_trigger.yml
branch:
  - buttons:
      - name: 构建单个【中间件】AMD64
        description: 构建单个【中间件】AMD64
        event: web_trigger_amd_three # 触发的 CI 事件名
        inputs:
          #输入框（input）
          build_application_name:
            # 下拉选择框
            description: 输入【中间件】应用名称-AMD64
            required: false
            type: select
            default:
            options:
              - name: kafka
                value: kafka
              - name: clickhouse
                value: clickhouse
              - name: influxdb
                value: influxdb
              - name: postgres
                value: postgres
              - name: postgis
                value: postgis
              - name: redis
                value: redis
              - name: apollo
                value: apollo
              - name: nacos
                value: nacos
              - name: emqx
                value: emqx
              - name: fastdfs
                value: fastdfs
              - name: openjdk
                value: openjdk
              - name: geoserver
                value: geoserver
              - name: nginx
                value: nginx
              - name: libreoffice
                value: libreoffice
              - name: minio
                value: minio
          build_version:
            description: 输入版本号（如 3.9.2），为空则直接构建
            required: false
            type: text
            default:
      - name: 构建单个【中间件】ARM64
