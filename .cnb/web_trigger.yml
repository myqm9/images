            options:
              - name: kafka
                value: kafka
              - name: clickhouse
                value: clickhouse
              - name: influxdb
                value: influxdb
              - name: postgres
                value: postgres
              - name: postgis
                value: postgis
              - name: redis
                value: redis
              - name: apollo
                value: apollo
              - name: nacos
                value: nacos
              - name: emqx
                value: emqx
              - name: fastdfs
                value: fastdfs
              - name: openjdk
                value: openjdk
              - name: geoserver
                value: geoserver
              - name: nginx
                value: nginx
              - name: libreoffice
                value: libreoffice
              - name: minio
                value: minio
          build_version:
            description: 输入版本号（如 3.9.2），为空则直接构建
            required: false
            type: text
            default:

