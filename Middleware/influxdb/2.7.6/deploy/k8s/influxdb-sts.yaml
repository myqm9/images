apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tsingyun-influxdb-sts
  namespace: default
  labels:
    name: tsingyun-influxdb-sts
spec:
  replicas: 1
  selector:
    matchLabels:
      name: tsingyun-influxdb-sts
  template:
    metadata:
      labels:
        name: tsingyun-influxdb-sts
    spec:
      imagePullSecrets:
        - name: tsingyun-harbor-secret
      containers:
        - name: tsingyun-influxdb-sts
          image: harbor.tsingyun.net/tsingyun-middleware/influxdb:2.7.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8086
              protocol: TCP
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: INFLUXD_PPROF_DISABLED
              value: "true"
            - name: DOCKER_INFLUXDB_INIT_MODE
              value: "setup"
            - name: DOCKER_INFLUXDB_INIT_USERNAME
              value: "tsingyun"
            - name: DOCKER_INFLUXDB_INIT_PASSWORD
              value: "xxxxx"
            - name: DOCKER_INFLUXDB_INIT_ORG
              value: "tsingyun"
            - name: DOCKER_INFLUXDB_INIT_BUCKET
              value: "tsingyun"
            - name: DOCKER_INFLUXDB_INIT_ADMIN_TOKEN
              value: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          resources:
            limits:
              cpu: "4"
              memory: 8192Mi
            requests:
              cpu: "2"
              memory: 4096Mi
          readinessProbe:
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            httpGet:
              path: /ping
              port: 8086
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            httpGet:
              path: /ping
              port: 8086
          volumeMounts:
            - name: data-50g-pvc
              mountPath: /var/lib/influxdb2
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
      volumes:
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
  volumeClaimTemplates:
    - metadata:
        name: data-50g-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: nfs-dynamic
        resources:
          requests:
            storage: 50Gi

