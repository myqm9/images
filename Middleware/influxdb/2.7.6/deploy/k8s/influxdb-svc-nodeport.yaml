apiVersion: v1
kind: Service
metadata:
  name: tsingyun-influxdb-svc-nodeport
  namespace: default
  labels:
    name: tsingyun-influxdb-svc-nodeport
spec:
  type: NodePort
  ports:
    - port: 8086
      targetPort: 8086
      protocol: TCP
      name: influxdb
  selector:
    name: tsingyun-influxdb-sts
