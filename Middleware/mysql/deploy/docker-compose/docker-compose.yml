version: '3.0'
services:
  mysql:
    restart: always
    image: dockerhub.qingcloud.com/tsingyun_database/mysql:5.7.44
    container_name: mysql
    networks:
      - tsingyun
    volumes:
      - /home/application/Database/mysql/data:/var/lib/mysql
      - /home/application/Database/mysql/etc:/etc/mysql/conf.d
      - /home/application/Database/mysql/init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: 'xxxx'
      TZ: 'Asia/Shanghai'
    ports:
      - 3306:3306
    command:
      --default-authentication-plugin=mysql_native_password
      --explicit_defaults_for_timestamp=true
      --character_set_server=utf8
      --collation-server=utf8_general_ci
      --log-error=/var/lib/mysql/mysql_error.log

networks:
  tsingyun:
    external: true