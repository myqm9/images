apiVersion: v1
kind: Service
metadata:
  name: tsingyun-geoserver-svc-nodeport
  namespace: default
  labels:
    name: tsingyun-geoserver-svc-nodeport
spec:
  type: NodePort
  selector:
    name: tsingyun-geoserver-sts
  ports:
    - name: geoserver-http-external
      port: 8080
      targetPort: 8080
      protocol: TCP
