apiVersion: v1
kind: Service
metadata:
  name: tsingyun-emqx-svc
  namespace: default
  labels:
    name: tsingyun-emqx-svc
spec:
  type: ClusterIP
  selector:
    name: tsingyun-emqx-sts
  ports:
    - name: dashboard
      port: 18083
      targetPort: 18083
    - name: mqtt
      port: 1883
      targetPort: 1883
    - name: api
      port: 8081
      targetPort: 8081
    - name: mqtt-ssl
      port: 8883
      targetPort: 8883
