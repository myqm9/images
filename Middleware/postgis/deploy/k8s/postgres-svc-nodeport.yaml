apiVersion: v1
kind: Service
metadata:
  name: tsingyun-postgis-svc-nodeport
  namespace: default
  labels:
    name: tsingyun-postgis-svc-nodeport
spec:
  type: NodePort
  selector:
    name: tsingyun-postgis-sts
  ports:
    - name: postgis-external
      port: 5432
      targetPort: 5432
      nodePort: 30432
      protocol: TCP
