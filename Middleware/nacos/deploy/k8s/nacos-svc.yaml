apiVersion: v1
kind: Service
metadata:
  name: tsingyun-nacos-svc
  namespace: default
  labels:
    name: tsingyun-nacos-svc
spec:
  type: ClusterIP
  ports:
    - port: 8848
      targetPort: 8848
      name: nacos
    - port: 9848
      targetPort: 9848
      name: nacos-rpc
  selector:
    name: tsingyun-nacos-sts
