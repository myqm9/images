apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tsingyun-nacos-sts
  namespace: default
  labels:
    name: tsingyun-nacos-sts
spec:
  serviceName: tsingyun-nacos-headless
  replicas: 1
  selector:
    matchLabels:
      name: tsingyun-nacos-sts
  template:
    metadata:
      labels:
        name: tsingyun-nacos-sts
    spec:
      containers:
        - name: tsingyun-nacos-sts
          image: harbor.tsingyun.net/tsingyun-middleware/tsingyun-nacos:2.5.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: server
              containerPort: 8848
            - name: client-rpc
              containerPort: 9848
          env:
            - name: MODE
              value: "standalone"
            - name: NACOS_AUTH_ENABLE
              value: "true"
            - name: NACOS_AUTH_TOKEN
              value: "u2n9mtaRRQuZ0ukPWs542yAVQCMP9upuWwrxTTXlO9hBb6nVDTjOOLQKJww3a"
            - name: NACOS_AUTH_IDENTITY_KEY
              value: "serverIdentity"
            - name: NACOS_AUTH_IDENTITY_VALUE
              value: "39!=5TU#R;mJoF.B9#*+Axer*5LFht4T"
          resources:
            limits:
              cpu: "500m"
              memory: 2048Mi
            requests:
              cpu: "200m"
              memory: 1024Mi
          readinessProbe:
            initialDelaySeconds: 80
            periodSeconds: 5
            timeoutSeconds: 3
            httpGet:
              path: /nacos/actuator/health
              port: 8848
          livenessProbe:
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            httpGet:
              path: /nacos/actuator/health
              port: 8848
          volumeMounts:
            - name: data-30g-pvc
              mountPath: /home/nacos/data
              subPath: data
      imagePullSecrets:
        - name: tsingyun-harbor-secret
  volumeClaimTemplates:
    - metadata:
        name: data-30g-pvc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: nfs-dynamic
        resources:
          requests:
            storage: 30Gi
