apiVersion: v1
kind: Service
metadata:
  name: tsingyun-nacos-svc-nodeport
  namespace: default
  labels:
    name: tsingyun-nacos-svc-nodeport
spec:
  type: NodePort
  ports:
    - port: 8848
      targetPort: 8848
      nodePort: 30848
      name: nacos
    - port: 9848
      targetPort: 9848
      name: nacos-rpc
  selector:
    name: tsingyun-nacos-sts